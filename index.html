<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electronic Signature App</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="titlebar">
      <div class="titlebar-title">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
          <path d="m15 5 4 4"></path>
        </svg>
        <span>Electronic Signature App</span>
      </div>

      <div class="titlebar-controls">
        <div class="titlebar-button minimize">
          <svg viewBox="0 0 10 1">
            <rect stroke="currentColor" width="10" height="1"></rect>
          </svg>
        </div>
        <div class="titlebar-button maximize">
          <svg viewBox="0 0 10 10">
            <rect
              width="10"
              height="10"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            ></rect>
          </svg>
        </div>
        <div class="titlebar-button close">
          <svg viewBox="0 0 10 10">
            <line
              x1="0"
              y1="0"
              x2="10"
              y2="10"
              stroke="currentColor"
              stroke-width="1"
            ></line>
            <line
              x1="10"
              y1="0"
              x2="0"
              y2="10"
              stroke="currentColor"
              stroke-width="1"
            ></line>
          </svg>
        </div>
      </div>
    </div>

    <div id="root" class="content-container"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Window control functionality
      document.querySelector(".minimize").addEventListener("click", () => {
        window.electronAPI.minimizeWindow();
      });

      document.querySelector(".maximize").addEventListener("click", () => {
        window.electronAPI.maximizeWindow();
      });

      document.querySelector(".close").addEventListener("click", () => {
        window.electronAPI.closeWindow();
      });
    </script>
  </body>
</html>
